<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Enterprise Dashboard</mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="email" placeholder="admin@dashboard.com" />
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="password" />
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <div class="error-message" *ngIf="errorMessage">
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button
        mat-raised-button
        color="primary"
        class="full-width"
        (click)="onLogin()"
        [disabled]="isLoading"
      >
        @if (isLoading) {
            <mat-spinner diameter="20"></mat-spinner>
        } @else {
            <span>Sign In</span>
        }
      </button>
    </mat-card-actions>

    <mat-card-footer>
      <p class="hint">Use admin@dashboard.com / admin123</p>
    </mat-card-footer>
  </mat-card>
</div>
