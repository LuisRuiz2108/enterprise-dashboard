<mat-card class="table-card">
  <mat-card-header>
    <mat-card-title>Top 50 Countries by Population</mat-card-title>
    <span class="spacer"></span>
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Country, region..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </mat-card-header>

  <mat-card-content>
    @if (isLoading()) {
      <div class="loading">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Loading data...</p>
      </div>
    } @else {
      <table mat-table [dataSource]="dataSource" matSort class="table">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
          <td mat-cell *matCellDef="let row">{{ row.id }}</td>
        </ng-container>

        <ng-container matColumnDef="flag">
          <th mat-header-cell *matHeaderCellDef>Flag</th>
          <td mat-cell *matCellDef="let row">
            <img [src]="row.flag" [alt]="row.country" class="flag" />
          </td>
        </ng-container>

        <ng-container matColumnDef="country">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Country</th>
          <td mat-cell *matCellDef="let row">{{ row.country }}</td>
        </ng-container>

        <ng-container matColumnDef="population">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Population</th>
          <td mat-cell *matCellDef="let row">{{ row.population | number }}</td>
        </ng-container>

        <ng-container matColumnDef="region">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Region</th>
          <td mat-cell *matCellDef="let row">
            <span class="region-badge">{{ row.region }}</span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data" colspan="5">No results for "{{ filterValue() }}"</td>
        </tr>

      </table>

      <mat-paginator
        [pageSizeOptions]="[10, 25, 50]"
        pageSize="10"
        showFirstLastButtons
      ></mat-paginator>
    }
  </mat-card-content>
</mat-card>
