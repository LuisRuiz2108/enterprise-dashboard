<mat-card class="chart-card">
  <mat-card-header>
    <mat-card-title>Population by Region</mat-card-title>
    <mat-card-subtitle>Top 50 countries grouped by region</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content class="chart-content">
    @if (isLoading()) {
      <div class="loading">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Loading chart...</p>
      </div>
    } @else {
      <canvas baseChart
        [data]="chartData"
        [options]="chartOptions"
        type="bar">
      </canvas>
    }
  </mat-card-content>
</mat-card>
